<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PacMan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="board"></canvas>
        <div id="end-screen" class="hidden">
            <div class="end-modal">
                <h1 id="end-title">GAME OVER</h1>
                <p id="end-score">Pontuação: 0</p>
                <div class="end-buttons">
                    <button id="btn-restart" type="button">Jogar Novamente</button>
                    <button id="btn-home" type="button">Tela Inicial</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
